apiVersion: apps/v1
kind: Deployment
metadata:
  name: platformlens-valid
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platformlens-valid
  template:
    metadata:
      labels:
        app: platformlens-valid
    spec:
      containers:
        - name: app
          image: nginx:1.27
